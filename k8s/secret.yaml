  POSTGRES_PASSWORD: "password"
  JWT_SECRET: "your-jwt-secret"
  SECRET_KEY_BASE: "your-secret-key-base"
  DATABASE_URL: "postgresql://postgres:password@crm-db-service:5432/wingmate_production"
