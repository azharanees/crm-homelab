apiVersion: v1
kind: Service
metadata:
  name: crm-backend-service
  namespace: crm-production
  labels:
    app: crm-backend
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: crm-backend  # This must match your pod labels exactly
