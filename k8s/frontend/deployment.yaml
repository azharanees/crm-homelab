apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-frontend
  namespace: crm-production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crm-frontend
  template:
    metadata:
      labels:
        app: crm-frontend
    spec:
      containers:
      - name: frontend
        image: azhar1234/crm-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5173
        # No VITE_API_URL needed - Nginx handles proxying
        livenessProbe:
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 5
          periodSeconds: 10
