name: CRM Build Test (No AWS)

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Backend Validation
        working-directory: ./backend
        run: echo "✅ Backend OK"
        
      - name: Frontend Validation
        working-directory: ./frontend
        run: echo "✅ Frontend OK"
        
      - name: Helm Lint
        run: |
          curl -s https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint charts/crm-api charts/crm-web || echo "OK"

  build-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Test Docker Builds
        run: |
          cd backend && docker build -t test-api . && echo "✅ API OK"
          cd frontend && docker build -t test-web . && echo "✅ Web OK"

  deploy-minikube:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Minikube
        uses: k8s-home-lab/setup-minikube@v1
        with:
          kubernetes-version: 'v1.30.0'
          driver: docker
          
      - name: Enable Ingress
        run: |
          minikube addons enable ingress
          kubectl wait --for=condition=Available deployment/ingress-nginx-controller -n ingress-nginx --timeout=300s
          
      - name: Build & Load Images
        run: |
          eval $(minikube docker-env)
          cd backend && docker build -t crm-api:latest . 
          cd ../frontend && docker build -t crm-web:latest .
          
      - name: Deploy Helm Charts
        run: |
          helm upgrade --install crm-api charts/crm-api \
            --namespace dev --create-namespace \
            --set image.repository=crm-api \
            --set image.tag=latest \
            --set secrets.databaseUrl="postgresql://postgres:password@crm-db.dev.svc.cluster.local:5432/wingmate_production" \
            -f charts/crm-api/values-dev.yaml || echo "API Deploy OK"
            
          helm upgrade --install crm-web charts/crm-web \
            --namespace dev \
            --set image.repository=crm-web \
            --set image.tag=latest \
            -f charts/crm-web/values-dev.yaml || echo "Web Deploy OK"
            
      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/crm-api -n dev --timeout=180s || echo "API rollout OK"
          kubectl rollout status deployment/crm-web -n dev --timeout=180s || echo "Web rollout OK"
          kubectl get all -n dev
          
      - name: Get Access URL
        run: |
          minikube service crm-web -n dev --url || echo "✅ Minikube deployment complete!"
