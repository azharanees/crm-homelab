name: CRM Local Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-
          
    - name: Backend tests
      run: |
        cd backend
        bundle exec rspec
        
    - name: Frontend tests
      run: |
        cd frontend
        npm ci
        npm test
        
  deploy-local:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.15.0
        
    - name: Set up Minikube
      uses: k8s-home-lab/setup-minikube@v1
      with:
        kubernetes-version: 'v1.30.0'
        driver: docker
        minikube-version: 'v1.34.0'
        
    - name: Enable Minikube addons
      run: |
        minikube addons enable ingress
        kubectl wait --for=condition=Available deployment/ingress-nginx-controller --namespace=ingress-nginx --timeout=300s
        
    - name: Build and load images
      run: |
        eval $(minikube docker-env)
        
        # Build backend
        cd backend
        docker build -t crm-api:latest .
        minikube image load crm-api:latest
        
        # Build frontend
        cd ../frontend
        docker build -t crm-web:latest .
        minikube image load crm-web:latest
        
    - name: Helm lint
      run: |
        helm lint charts/crm-api
        helm lint charts/crm-web
        
    - name: Deploy to Minikube
      run: |
        helm upgrade --install crm-api charts/crm-api \
          --namespace dev --create-namespace \
          --set image.repository=crm-api \
          --set image.tag=latest \
          -f charts/crm-api/values-dev.yaml
          
        helm upgrade --install crm-web charts/crm-web \
          --namespace dev \
          --set image.repository=crm-web \
          --set image.tag=latest \
          -f charts/crm-web/values-dev.yaml
        
    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/crm-api -n dev --timeout=300s
        kubectl rollout status deployment/crm-web -n dev --timeout=300s
        
    - name: Test deployment
      run: |
        kubectl wait --for=condition=Available deployment/crm-api --namespace=dev --timeout=300s
        kubectl wait --for=condition=Available deployment/crm-web --namespace=dev --timeout=300s
        
        minikube service crm-web --namespace=dev --url
        echo "✅ CRM deployed to Minikube! Check Minikube dashboard."
        
    - name: Show status
      run: |
        kubectl get all -n dev
        kubectl get ingress -n dev
