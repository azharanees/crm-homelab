services:
  db:
    image: postgres:15-alpine
    container_name: crm_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wingmate_production}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
      args:
        RAILS_ENV: production
    container_name: crm_backend
    ports:
      - "${RAILS_PORT:-3000}:3000"
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wingmate_production}
      JWT_SECRET: ${JWT_SECRET}
      RAILS_LOG_TO_STDOUT: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      PUMA_BIND: tcp://0.0.0.0:3000
    volumes:
      - backend_gems:/usr/local/bundle
      - backend_logs:/app/log
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crm_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm_frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    depends_on:
      - backend
    networks:
      - crm_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    driver: local
  backend_gems:
    driver: local
  backend_logs:
    driver: local

networks:
  crm_network:
    driver: bridge
