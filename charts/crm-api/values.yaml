replicaCount: 2

image:
  repository: "" # Will be set via ECR output
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

ingress:
  enabled: false

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  RAILS_ENV: development
  LOG_LEVEL: debug
  DATABASE_HOST: postgres-service
  DATABASE_PORT: "5432"

serviceAccount:
  create: true
  name: crm-api

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

podAnnotations: {}

nodeSelector: {}

tolerations: []

affinity: {}
