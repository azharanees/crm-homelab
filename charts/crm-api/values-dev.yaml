replicaCount: 2

image:
  tag: "latest"

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false

env:
  RAILS_ENV: development
  LOG_LEVEL: debug
  
secrets:
  databaseUrl: "postgresql://postgres:devpass@{{ .Release.Name }}-db.dev.svc.cluster.local:5432/wingmate_production"
  jwtSecret: "dev-jwt-secret-change-me"
  railsMasterKey: "your-rails-master-key-here"
