apiVersion: v1
kind: Secret
metadata:
  name: {{ include "crm-api.fullname" . }}-secrets
  labels:
    {{- include "crm-api.labels" . | nindent 4 }}
type: Opaque
data:
  RAILS_ENV: {{ .Values.env.RAILS_ENV | b64enc | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | b64enc | quote }}
  DATABASE_HOST: {{ .Values.env.DATABASE_HOST | b64enc | quote }}
  DATABASE_PORT: {{ .Values.env.DATABASE_PORT | b64enc | quote }}
  POSTGRES_USER: {{ "postgres" | b64enc | quote }}
  POSTGRES_PASSWORD: {{ "password" | b64enc | quote }}
  DATABASE_URL: {{ printf "postgresql://postgres:password@%s:5432/crm_development" .Values.env.DATABASE_HOST | b64enc | quote }}
  SECRET_KEY_BASE: {{ "development_secret_key_base_change_in_production" | b64enc | quote }}
